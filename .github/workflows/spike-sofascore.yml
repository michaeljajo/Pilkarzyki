# TEMPORARY (Phase 0 spike): can a GitHub-hosted runner reach SofaScore via impit?
# Delete once the score-sync hosting decision is made.
name: spike-sofascore

on:
  push:
    branches: [feat/auto-score-sync]
    paths:
      - 'scripts/spike-sofascore.ts'
      - 'src/lib/score-sync/**'
      - '.github/workflows/spike-sofascore.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/spike-sofascore.ts
